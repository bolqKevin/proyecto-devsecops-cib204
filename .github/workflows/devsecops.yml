name: Pipeline DevSecOps CIB-204

# Se ejecuta en cada push y en cada pull request a main, y a mano desde Actions.
on:
  push:
    branches: ["main", "inseguro", "solucion"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# Permisos minimos; el job de CodeQL necesita escribir eventos de seguridad.
permissions:
  contents: read

jobs:
  # ==========================================================================
  # 1) SAST con Semgrep  ->  detecta eval(), inyeccion SQL/comandos, JWT, CORS
  # ==========================================================================
  sast_semgrep:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.146.0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Ejecutar Semgrep
        # --error hace fallar el job si hay hallazgos; se guarda el SARIF.
        run: semgrep scan --config p/default --config p/javascript --config p/nodejs --error --sarif --output semgrep.sarif .
      - name: Guardar reporte Semgrep
        if: always()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: reporte-semgrep
          path: semgrep.sarif

  # ==========================================================================
  # 2) SAST con CodeQL -> motor de analisis de GitHub para JavaScript.
  # ==========================================================================
  sast_codeql:
    name: SAST - CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Inicializar CodeQL
        uses: github/codeql-action/init@f35333b910470a5408cb081b68f0701254a7d27b # v3.28.18
        with:
          languages: javascript
          queries: security-extended
      - name: Analizar con CodeQL
        uses: github/codeql-action/analyze@f35333b910470a5408cb081b68f0701254a7d27b # v3.28.18

  # ==========================================================================
  # 3) Deteccion de secretos con Gitleaks  ->  .env, llave privada, claves AWS
  # ==========================================================================
  secretos:
    name: Secretos - Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Ejecutar Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.4 \
            detect --source=/repo --no-git -v \
            --report-format sarif --report-path /repo/gitleaks.sarif
      - name: Guardar reporte Gitleaks
        if: always()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: reporte-gitleaks
          path: gitleaks.sarif

  # ==========================================================================
  # 4) SCA - Analisis de dependencias  ->  npm audit + Trivy (sistema de archivos)
  # ==========================================================================
  sca:
    name: SCA - Dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Instalar dependencias reproducibles
        working-directory: servidor
        run: npm ci
      - name: npm audit (falla en severidad alta o critica)
        working-directory: servidor
        run: npm audit --audit-level=high
      - name: Pruebas unitarias e integracion
        working-directory: servidor
        env:
          AUTH_ENABLED: 'false'
        run: npm test -- --runInBand
      - name: Trivy - dependencias (fs)
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87 # master, pinned
        with:
          scan-type: fs
          scan-ref: servidor
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: table

  # ==========================================================================
  # 5) Seguridad de la imagen  ->  Trivy (imagen) + SBOM con Syft
  # ==========================================================================
  imagen:
    name: Imagen - Trivy + SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Construir la imagen
        run: docker build -t cifrado:${{ github.sha }} ./servidor
      - name: Trivy - escaneo de imagen
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87 # master, pinned
        with:
          scan-type: image
          image-ref: cifrado:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: table
      - name: Generar SBOM (Syft)
        if: always()
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: cifrado:${{ github.sha }}
          output-file: sbom.spdx.json
      - name: Guardar SBOM
        if: always()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: sbom
          path: sbom.spdx.json

  # ==========================================================================
  # 6) DAST - OWASP ZAP  ->  ataca la app en ejecucion (cabeceras, CORS, etc.)
  # ==========================================================================
  dast:
    name: DAST - OWASP ZAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Levantar el servicio
        run: |
          docker build -t cifrado ./servidor
          docker run -d -p 3000:3000 --name cifrado cifrado
          sleep 8
          curl -s http://localhost:3000/salud || true
      - name: OWASP ZAP Baseline (genera el informe)
        run: |
          mkdir -p "$PWD/zap" && chmod 777 "$PWD/zap"
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:3000 -r informe_zap.html -a -I || true
      - name: Guardar informe ZAP
        if: always()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: reporte-zap
          path: zap/informe_zap.html
