services:
  cifrado:
    build: ./servidor
    container_name: cifrado
    ports:
      - "3000:3000"
    environment:
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      KEYCLOAK_URL: ${KEYCLOAK_URL:-http://keycloak:8080}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://localhost:8080/realms/appmovil}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-appmovil}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-servicio-cifrado}
      ORIGEN_PERMITIDO: ${ORIGEN_PERMITIDO:-http://localhost:8081}
    depends_on:
      - keycloak
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Define KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HOSTNAME_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
      KC_HOSTNAME_ADMIN_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
    ports:
      - "8080:8080"
    restart: unless-stopped
